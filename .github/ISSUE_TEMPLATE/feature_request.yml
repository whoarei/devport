name: 特性请求
description: 提出新功能或改进建议，说明使用场景与期望效果。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请从实际使用场景出发描述需求，支持使用中文或英文填写。
        如果遇到现有功能的异常行为，请使用 Bug 报告模板。
        架构、性能或工程流程方面的建议，请使用技术改进模板。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，确认没有相同的特性请求。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 你想完成什么任务？目前遇到了什么限制？如涉及特定系统、连接方式或工作区来源，请一并说明。
      placeholder: 当我……时，目前需要……，导致……
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 期望的功能或改进
      description: 描述期望的操作流程和结果，可以附上示例；不需要提供具体实现方案。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 目前如何绕过这个限制？考虑过哪些替代方案，它们有什么不足？
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可提供截图、草图、参考链接或相关 Issue，帮助说明需求。
