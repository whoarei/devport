name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的稳定版本标签 (例如 v0.3.0)，构建该标签对应的代码"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Validate release tag
        id: meta
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -cnotmatch '\Av(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\z') {
            throw '发布标签必须为稳定版本 vX.Y.Z'
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          # Icons are Git LFS objects; without this the bundle embeds LFS pointer files
          # and the title bar / about dialog icons render as broken images.
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw '请先配置 TAURI_SIGNING_PRIVATE_KEY；签名缺失时禁止发布升级产物'
          }

      - name: Sync application and lockfile versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          node scripts/release.mjs sync $env:RELEASE_TAG

      - name: Test frontend and release tooling
        run: npm test

      - name: Build Tauri app (exe + NSIS installer + updater artifacts)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign 私钥：仅存在于 Secrets，用于 updater 产物签名与 latest.json 生成
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "DevPort ${{ steps.meta.outputs.tag }}"
          # Keep uploads private until all assets and the updater manifest pass validation.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # Tauri 2 signs the NSIS exe directly. Avoid inline JSON shell quoting.
          args: --bundles nsis --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json

      - name: Verify isolated NSIS migration
        shell: pwsh
        run: ./scripts/test-installer-migration.ps1 -InstallerScript src-tauri/target/x86_64-pc-windows-msvc/release/nsis/x64/installer.nsi

      - name: Upload portable exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $env:RELEASE_VERSION
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/devport.exe"
          $portable = "DevPort_${version}_x64-portable.exe"
          Copy-Item $exe $portable
          gh release upload $tag $portable --clobber

      - name: Validate updater manifest and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force release-check | Out-Null
          gh release download $env:RELEASE_TAG --pattern latest.json --dir release-check --clobber
          if ($LASTEXITCODE -ne 0) { throw '缺少 latest.json' }
          # Keep the old URL accepted by installed Remote Runner clients.
          # GitHub redirects it to DevPort; installer bytes/signatures stay intact.
          node scripts/release.mjs bridge release-check/latest.json $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw '更新地址兼容处理失败' }
          gh release view $env:RELEASE_TAG --json assets | Set-Content release-check/assets.json
          if ($LASTEXITCODE -ne 0) { throw '无法读取 Release 产物' }
          node scripts/release.mjs verify release-check/latest.json release-check/assets.json $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw '更新清单或产物校验失败' }
          gh release upload $env:RELEASE_TAG release-check/latest.json release-check/devport-latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw '无法上传兼容更新清单' }
          gh release download $env:RELEASE_TAG --pattern '*latest.json' --dir release-check --clobber
          if ($LASTEXITCODE -ne 0) { throw '无法回读更新清单' }
          node scripts/release.mjs verify release-check/latest.json release-check/assets.json $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw '已上传的更新清单校验失败' }

      - name: Publish release as Latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release edit $env:RELEASE_TAG --notes-file "docs/releases/$($env:RELEASE_TAG).md" --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw '无法公开 Release 并设为 Latest' }
