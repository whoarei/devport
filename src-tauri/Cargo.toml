[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-serial = { version = "5", default-features = false }
# 使用 ring 加密后端，避免 aws-lc-sys 在 Windows 上依赖 NASM
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
futures = "0.3"
portable-pty = "0.9"
# Managed Python runtime（设计 00005-python-runtime.md）：TOML 项目契约解析、uv 资产解包、下载
toml = "0.8"
tar = "0.4"
flate2 = "1"
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false }
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Threading", "Win32_System_Services", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package]
name = "devport"
version = "1.1.1"
description = "DevPort development workbench"
edition = "2021"
build = "build.rs"
default-run = "devport"

[[bin]]
name = "devport"
path = "src/main.rs"

[[bin]]
name = "rr-cli"
path = "src/bin/rr_cli.rs"
